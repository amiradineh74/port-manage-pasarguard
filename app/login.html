<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود | مانیتورینگ ترافیک</title><style>body{font-family:Tahoma,Arial,sans-serif;background:#09111e;color:#eff6ff;display:grid;place-items:center;min-height:95vh}form{background:#152338;border:1px solid #35435a;border-radius:18px;padding:30px;width:min(350px,85vw)}h1{font-size:21px}label{display:block;margin:18px 0;font-size:14px}input{display:block;width:100%;box-sizing:border-box;margin-top:8px;padding:12px;border-radius:9px;border:1px solid #51607c;background:#0a1422;color:white}button{width:100%;padding:13px;background:#69b5ff;color:#0a182a;border:0;border-radius:10px;cursor:pointer;font-weight:bold}p{color:#9cafc5;font-size:12px;line-height:2}</style></head><body><form action="/login" method="post"><h1>ورود به مانیتورینگ پورت‌ها</h1><label>نام کاربری<input name="username" autocomplete="username" required></label><label>رمز عبور<input type="password" name="password" autocomplete="current-password" required></label><button>ورود</button><p>برنامه مستقل از پنل اصلی است؛ از همان سرور و با دسترسی محدود استفاده می‌کند.</p></form></body></html>
