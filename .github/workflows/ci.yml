name: Python tests
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and run tests
        run: |
          python -m compileall -q app tests
          python -m unittest discover -s tests -v
          bash -n bootstrap.sh install.sh update.sh uninstall.sh publish.sh reinstall-keep-usage.sh
          node --check app/dashboard.js
          node --check app/jalali.js
          node --check app/finance.js
          node tests/test_jalali.js
          node tests/test_frontend.js
          node tests/test_finance_frontend.js
