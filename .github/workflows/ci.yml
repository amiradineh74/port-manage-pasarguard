name: Python tests
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and run tests
        run: |
          python -m compileall -q app tests
          python -m unittest discover -s tests -v
          bash -n bootstrap.sh install.sh update.sh uninstall.sh publish.sh
          node --check app/dashboard.js bootstrap.sh publish.sh
